name: Test

on:
  push:
    branches: [ "main", "action/publish" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# MSBuild picks environment variables up as properties. With this one "dotnet test" prints each
# failed test with its message and stack trace instead of only pointing at a log file on the
# runner. The full logs are uploaded as an artifact when a run fails.
env:
  TestingPlatformShowTestsFailure: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: EMXDemo Unit Test
        run: dotnet test ./Tests/DemoCenter.Desktop.UI.Tests/DemoCenter.Desktop.UI.Tests.csproj
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          # Logs only: the screenshots next to them are named after page captions such as
          # "Experience >= 1=False.png", and upload-artifact rejects < > : | * ? " in file names.
          path: Tests/DemoCenter.Desktop.UI.Tests/bin/Debug/net10.0/TestResults/*.log
          if-no-files-found: ignore

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The tests open real windows through UsePlatformDetect(), so X11 needs a display.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: EMXDemo Unit Test
        run: xvfb-run -a dotnet test ./Tests/DemoCenter.Desktop.UI.Tests/DemoCenter.Desktop.UI.Tests.csproj
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-ubuntu
          # Logs only: the screenshots next to them are named after page captions such as
          # "Experience >= 1=False.png", and upload-artifact rejects < > : | * ? " in file names.
          path: Tests/DemoCenter.Desktop.UI.Tests/bin/Debug/net10.0/TestResults/*.log
          if-no-files-found: ignore

  # The tests open real windows. GitHub's macOS runners execute under a logged in GUI session, so
  # that works, but two things are needed that the other platforms do not care about:
  #   * caffeinate - Avalonia's native backend builds its render timer from CVDisplayLink and fails
  #     with "RenderTimer -6661" if no display is awake;
  #   * a macOS build of assimp next to the binary - the 3D demo loads models through AssimpNet,
  #     which dlopen()s a bare "libassimp.dylib" and therefore does not see Homebrew's copy in
  #     /opt/homebrew/lib. This mirrors the libassimp.so step already present in publish.yml.
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install native dependencies
        run: brew install assimp
      - name: Build
        run: dotnet build ./Tests/DemoCenter.Desktop.UI.Tests/DemoCenter.Desktop.UI.Tests.csproj -c Debug
      - name: Copy assimp next to the test binary
        run: cp "$(brew --prefix)/lib/libassimp.dylib" ./Tests/DemoCenter.Desktop.UI.Tests/bin/Debug/net10.0/
      - name: EMXDemo Unit Test
        run: caffeinate -disu dotnet test ./Tests/DemoCenter.Desktop.UI.Tests/DemoCenter.Desktop.UI.Tests.csproj -c Debug --no-build
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-macos
          # Logs only: the screenshots next to them are named after page captions such as
          # "Experience >= 1=False.png", and upload-artifact rejects < > : | * ? " in file names.
          path: Tests/DemoCenter.Desktop.UI.Tests/bin/Debug/net10.0/TestResults/*.log
          if-no-files-found: ignore

  # DemoCenter under WebAssembly: publishes Tests.Wasm/DemoCenter.Wasm.TestHost (Release_WASM,
  # trimmed, native Skia relink - hence wasm-tools) and drives it with headless Chromium from the
  # chromium.linux-x64 nuget package. The script's exit code is the number of failed tests.
  # See Tests.Wasm/README.md.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools
      - name: EMXDemo WASM Test
        env:
          WASM_TEST_RESULTS: ${{ github.workspace }}/Tests.Wasm/TestResults
        run: bash ./Tests.Wasm/run-wasm-tests.sh
      - name: Upload WASM test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wasm-test-results
          path: Tests.Wasm/TestResults
          if-no-files-found: ignore
