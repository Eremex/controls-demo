name: Release Tag

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make upload directory
        run: mkdir upload

      - name: Publish win-x64
        run: dotnet publish ./DemoCenter/DemoCenter.Desktop/DemoCenter.Desktop.csproj -r win-x64 -c Release --sc /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/win64

      - name: Zip win-x64
        run: |
          $files = Get-ChildItem -Path ./publish/win64/* -Recurse -Exclude *.pdb
          Compress-Archive -Path $files.FullName -DestinationPath ./upload/EMX.Demo.Desktop.win-x64.zip

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: ./upload

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make upload directory
        run: mkdir upload

      - name: Publish linux-x64
        run: dotnet publish ./DemoCenter/DemoCenter.Desktop/DemoCenter.Desktop.csproj -r linux-x64 -c Release --sc /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/linux64

      - name: Publish linux-x64 with files
        run: dotnet publish ./DemoCenter/DemoCenter.Desktop/DemoCenter.Desktop.csproj -r linux-x64 -c Release -o ./publish/linux64Files

      - name: Rename app
        run: mv ./publish/linux64/DemoCenter.Desktop ./publish/linux64/DemoCenter.App

      - name: Copy library
        run: mv ./publish/linux64Files/libassimp.so ./publish/linux64/libassimp.so

      - name: Zip linux-x64
        run: zip -j -r ./upload/EMX.Demo.Desktop.linux-x64.zip ./publish/linux64 -x "*.pdb"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux
          path: ./upload

  linux-rpi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make upload directory
        run: mkdir upload

      - name: Publish linux-arm64
        run: dotnet publish ./DemoCenter/DemoCenter.Desktop/DemoCenter.Desktop.csproj -r linux-arm64 -c Release --sc /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/linuxArm64
      - name: Rename app
        run: mv ./publish/linuxArm64/DemoCenter.Desktop ./publish/linuxArm64/DemoCenter.App

      - name: Zip linux-x64
        run: zip -j -r ./upload/EMX.Demo.Desktop.linux-arm64.zip ./publish/linuxArm64 -x "*.pdb"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux-rpi
          path: ./upload

  linux-orangepi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make upload directory
        run: mkdir upload

      - name: Publish linux-arm
        run: dotnet publish ./DemoCenter/DemoCenter.Desktop/DemoCenter.Desktop.csproj -r linux-arm -c Release --sc /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/linuxArm
      - name: Rename app
        run: mv ./publish/linuxArm/DemoCenter.Desktop ./publish/linuxArm/DemoCenter.App

      - name: Zip linux-arm
        run: zip -j -r ./upload/EMX.Demo.Desktop.linux-arm.zip ./publish/linuxArm -x "*.pdb"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux-orangepi
          path: ./upload


  osx-x64:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Make upload directory
        run: mkdir upload

      # A .app bundle rather than a bare executable: it carries the icon and the bundle identity,
      # and it is the only shape that can hold the native libraries the demo needs next to the
      # binary. BundleApp comes from the Dotnet.Bundle package the desktop project references and
      # reads the CFBundle* properties out of its csproj. The restore is explicit because the
      # target publishes for a specific RID and the default restore has no RID-specific assets.
      - name: Restore for osx-x64
        run: dotnet restore ./DemoCenter/DemoCenter.Desktop/DemoCenter.Desktop.csproj -r osx-x64

      - name: Bundle .app for osx-x64
        run: >
          dotnet msbuild ./DemoCenter/DemoCenter.Desktop/DemoCenter.Desktop.csproj
          -t:BundleApp
          -p:Configuration=Release
          -p:RuntimeIdentifier=osx-x64
          -p:SelfContained=true
          -p:UseAppHost=true

      - name: Install native dependencies
        run: brew install assimp molten-vk

      # Both libraries are dlopen()ed by bare name, so they have to sit next to the executable -
      # inside Contents/MacOS. AssimpNet loads "libassimp.dylib" for the 3D models; Silk.NET looks
      # for "libvulkan.dylib", and MoltenVK implements the Vulkan API itself, so copying it under
      # that name means Graphics3DControl runs with no Vulkan loader, no ICD manifest and no
      # VK_ICD_FILENAMES / DYLD_LIBRARY_PATH - none of which an app started from Finder would have.
      # Building on a macOS runner also means brew hands us a matching architecture: the arm64
      # image cannot produce an x64 dylib, which is why osx-x64 uses the Intel runner.
      # See Docs/macos.md in the controls repository.
      - name: Copy native libraries into the bundle
        run: |
          APP=./DemoCenter/DemoCenter.Desktop/bin/Release/net10.0/osx-x64/publish/DemoCenter.Desktop.app
          cp "$(brew --prefix)/lib/libassimp.dylib" "$APP/Contents/MacOS/"
          cp "$(brew --prefix)/lib/libMoltenVK.dylib" "$APP/Contents/MacOS/libvulkan.dylib"
          find "$APP" -name '*.pdb' -delete

      # ditto, not zip: a plain "zip -j" flattens directories, which destroys the bundle, and only
      # ditto preserves the symlinks and permissions that make the .app launchable after download.
      - name: Zip osx-x64
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          ./DemoCenter/DemoCenter.Desktop/bin/Release/net10.0/osx-x64/publish/DemoCenter.Desktop.app
          ./upload/EMX.Demo.Desktop.osx-x64.zip

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: osx-x64
          path: ./upload

  osx-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Make upload directory
        run: mkdir upload

      # A .app bundle rather than a bare executable: it carries the icon and the bundle identity,
      # and it is the only shape that can hold the native libraries the demo needs next to the
      # binary. BundleApp comes from the Dotnet.Bundle package the desktop project references and
      # reads the CFBundle* properties out of its csproj. The restore is explicit because the
      # target publishes for a specific RID and the default restore has no RID-specific assets.
      - name: Restore for osx-arm64
        run: dotnet restore ./DemoCenter/DemoCenter.Desktop/DemoCenter.Desktop.csproj -r osx-arm64

      - name: Bundle .app for osx-arm64
        run: >
          dotnet msbuild ./DemoCenter/DemoCenter.Desktop/DemoCenter.Desktop.csproj
          -t:BundleApp
          -p:Configuration=Release
          -p:RuntimeIdentifier=osx-arm64
          -p:SelfContained=true
          -p:UseAppHost=true

      - name: Install native dependencies
        run: brew install assimp molten-vk

      # Both libraries are dlopen()ed by bare name, so they have to sit next to the executable -
      # inside Contents/MacOS. AssimpNet loads "libassimp.dylib" for the 3D models; Silk.NET looks
      # for "libvulkan.dylib", and MoltenVK implements the Vulkan API itself, so copying it under
      # that name means Graphics3DControl runs with no Vulkan loader, no ICD manifest and no
      # VK_ICD_FILENAMES / DYLD_LIBRARY_PATH - none of which an app started from Finder would have.
      # Building on a macOS runner also means brew hands us a matching architecture: the arm64
      # image cannot produce an x64 dylib, which is why osx-x64 uses the Intel runner.
      # See Docs/macos.md in the controls repository.
      - name: Copy native libraries into the bundle
        run: |
          APP=./DemoCenter/DemoCenter.Desktop/bin/Release/net10.0/osx-arm64/publish/DemoCenter.Desktop.app
          cp "$(brew --prefix)/lib/libassimp.dylib" "$APP/Contents/MacOS/"
          cp "$(brew --prefix)/lib/libMoltenVK.dylib" "$APP/Contents/MacOS/libvulkan.dylib"
          find "$APP" -name '*.pdb' -delete

      # ditto, not zip: a plain "zip -j" flattens directories, which destroys the bundle, and only
      # ditto preserves the symlinks and permissions that make the .app launchable after download.
      - name: Zip osx-arm64
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          ./DemoCenter/DemoCenter.Desktop/bin/Release/net10.0/osx-arm64/publish/DemoCenter.Desktop.app
          ./upload/EMX.Demo.Desktop.osx-arm64.zip

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: osx-arm64
          path: ./upload


  draft-release:
    needs: [ windows, linux, linux-rpi, osx-x64, osx-arm64, linux-orangepi ]
    runs-on: ubuntu-latest
    steps:
      - name: Download windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows

      - name: Download linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux

      - name: Download linux-rpi Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-rpi

      - name: Download linux-orangepi Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-orangepi

      - name: Download osx-x64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: osx-x64

      - name: Download osx-arm64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: osx-arm64

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          generate_release_notes: true
          draft: true
          files: |
            *.zip
